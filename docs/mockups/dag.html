<!doctype html><html lang="zh"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Data Coffee · DAG Mock</title><style>*{box-sizing:border-box}body{margin:0;color:#243645;background:#f5f7f9;font:14px/1.6 system-ui}header{background:white;border-top:4px solid #25a3aa;border-bottom:1px solid #dde4ea;padding:16px 28px;display:flex;justify-content:space-between}.brand{font-weight:750;font-size:19px}.brand span{color:#21989d}main{padding:25px;max-width:1500px;margin:auto}h1{font-size:26px;margin:7px 0}small,.muted{color:#83909d}a{color:#238a96;text-decoration:none}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:22px}.badge{display:inline-block;background:#fff0d5;color:#9b6818;padding:4px 10px;border-radius:5px;font-size:12px}.workspace{display:grid;grid-template-columns:minmax(650px,1fr) 340px;border:1px solid #d9e1e7;border-radius:8px;overflow:hidden;min-height:670px}.graph{background-color:#f8fafc;background-image:radial-gradient(#cad5df 1px,transparent 1px);background-size:18px 18px;position:relative;padding:25px 20px}.bar{display:flex;gap:18px;font-size:12px;align-items:center;margin-bottom:20px}.bar strong{color:#288b96}.canvas{position:relative;min-width:610px;height:540px}.nodes{position:relative;height:100%;z-index:1}.node{position:absolute;transform:translateX(-50%);width:166px;height:90px;border:1px solid #bfcbd4;border-left:5px solid #e4b658;background:white;border-radius:6px;text-align:left;padding:12px;cursor:pointer;color:#263e4f;box-shadow:0 2px 4px #263e4f08;font:inherit}.node:hover{box-shadow:0 0 0 3px #309aa81a}.node.selected{outline:2px solid #238d9a;outline-offset:3px}.node strong{display:block;font-size:14px}.node small{display:block;margin-top:8px;font-size:11px}.node.done{border-left-color:#38aa88}.node.wait{border-left-color:#8e9dac}.node.ready{height:64px;border-left-color:#e4b658;text-align:center}.links{position:absolute;inset:0;width:100%;height:100%}.panel{backgroun .7%;top:150px" data-key="join"><strong>报名参加</strong><small>12 人提交意向 · 我已报名</small></button><button class="node" style="left:50%;top:150px" data-key="venue"><strong>提议场地</strong><small>2 个候选场地</small></button><button class="node done" style="left:83.3%;top:150px" data-key="host"><strong>报名主持人</strong><small>1 人报名</small></button><button class="node" style="left:16.7%;top:305px" data-key="time"><strong>确认最终时段</strong><small>等待发起人确认</small></button><button class="node" style="left:50%;top:305px" data-key="confirmVenue"><strong>确认场地</strong><small>等待发起人确认</small></button><button class="node done" style="left:83.3%;top:305px" data-key="confirmHost"><strong>确认主持人</strong><small>✓ 小林已确认</small></button><button class="node ready" style="left:50%;top:470px" data-key="ready"><strong>READY?</strong><small>2 项待确认</small></button></div></div><div class="legend"><span><i style="background:#38aa88"></i>已满足</span><span><i style="background:#e4b658"></i>待参与 / 确认</span><span><i style="background:#8e9dac"></i>尚未开始</span></div></section><aside class="panel" id="panel"></aside></div><div class="note">交互示例：点击任意节点 → 右侧面板切换；画布和连线保持稳定。表单仅模拟，不保存或发送请求。小屏面板移到画布下方。</div></main><script>
const checkbox=t=>`<label class="field"><input type="checkbox" checked>${t}</label>`;
const content={launch:['发起活动','规则已发布', '<p>最低 10 人，最多 15 人。<br>城市固定为 Amsterdam。<br>10 月 8 日 18:00 判断成行。</p>'],join:['报名参加','我的状态：已提交意向', '<div class="section">可以参加的时段'+checkbox('10 月 10 日 14:00–17:00 · 10 人')+checkbox('10 月 11 日 14:00–17:00 · 8 人')+'</div><div class="section">交通偏好'+checkbox('公共交通')+'<label class="field"><input type="checkbox">开车</label></div><div class="section">报名留言<textarea rows="2" placeholder="介绍一下自己…"></textarea></div><button class="primary">保存报名</button>'],venue:['提议场地','目前 2 个候选','<p>有合适的咖啡馆或会议空间？<br>提交地址、容量和可用时间。</p><label class="field">我的提议：Central Café · 15 人</label><button class="primary">编辑我的提议</button>'],host:['报名主持人','我的状态：尚未报名','<p>帮助大家互相认识，并照顾现场交流节奏。</p><textarea rows="4" placeholder="简单说说你自己"></textarea><button class="primary">提交主持人报名</button>'],time:['确认最终时段','仅发起人可确认','<p>选择后按可参加该时段的人数判断成行。</p><label class="field"><input name="time" type="radio" checked>10 月 10 日 · 10 人</label><label class="field"><input name="time" type="radio">10 月 11 日 · 8 人</label><button class="primary">确认最终时段</button>'],confirmVenue:['确认场地','仅发起人可确认','<p>选择一个最终场地，其他保留备用。</p><label class="field"><input name="v" type="radio" checked>Central Café · 15 人<br>车站步行 5 分钟</label><label class="field"><input name="v" type="radio">Studio Room · 20 人<br>提供停车位</label><button class="primary">确认场地</button>'],confirmHost:['确认主持人','已满足','<label class="field">✓ 小林 · 已确认</label><p>发起人确认后计入成行条件。</p>'],ready:['成行条件','等待最终确认','<label class="field">◷ 最终时间待确认</label><label class="field">◷ 场地待确认</label><label class="field">✓ 主持人已确认</label><p>截止时满足全部条件 → 成行<br>否则 → 活动取消</p>']};function select(key){document.querySelectorAll('.node').forEach(n=>n.classList.toggle('selected',n.dataset.key===key));const [title,status,body]=content[key];document.querySelector('#panel').innerHTML=`<small>节点详情</small><h2>${title}</h2><span class="badge">${status}</span>${body}<p id="feedback"></p>`;document.querySelector('.primary')?.addEventListener('click',()=>document.querySelector('#feedback').textContent='模拟操作完成 · 未保存任何数据');}document.querySelectorAll('.node').forEach(n=>n.onclick=()=>select(n.dataset.key));select('join');</script></html>
